const KEY='maxiBestMission2026'; let state;
try { state=JSON.parse(localStorage.getItem(KEY)||'{"answers":{},"favorites":{}}'); }
catch(err) { state={"answers":{},"favorites":{}}; } let page='list', filter='Alle', search='';
function getQuestions(e){
 let f=e.focus||e.tags[0]||'diesen Bereich';
 return [
 ['Wie spannend war dieser Stand für dich?',['😍 Sehr','🙂 Etwas','😐 Egal','🙁 Wenig','❌ Gar nicht']],
 [`Macht dir „${f}“ grundsätzlich Spaß?`,['👍 Ja','🤔 Vielleicht','👎 Nein']],
 ['Würdest du eine typische Aufgabe davon gern selbst ausprobieren?',['👍 Ja','🤔 Vielleicht','👎 Nein']],
 ['Könntest du dir vorstellen, so etwas öfter zu machen?',['👍 Ja','🤔 Vielleicht','👎 Nein']],
 ['Möchtest du diesen Stand später noch einmal genauer anschauen?',['⭐ Ja','🤔 Vielleicht','👎 Nein']]
 ];
}
const vals=[[4,3,2,1,0],[4,2,0],[4,2,0],[4,2,0],[4,2,0]];
function save(){localStorage.setItem(KEY,JSON.stringify(state)); updateHeader()}
function updateHeader(){let n=Object.keys(state.answers).length; document.getElementById('prog').style.width=(n/EXHIBITORS.length*100)+'%'; document.getElementById('headSub').textContent=`${n} von ${EXHIBITORS.length} Ausstellern bewertet`;}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.page===page));
 if(page==='result') return renderResult();
 if(page==='route') return renderRoute();
 let list=EXHIBITORS.filter(e=>(page!=='fav'||state.favorites[e.name])&&(filter==='Alle'||e.category===filter)&&(!search||(`${e.name} ${e.stand}`).toLowerCase().includes(search.toLowerCase())));
 let cats=['Alle'];
EXHIBITORS.forEach(function(x){ if(cats.indexOf(x.category)===-1) cats.push(x.category); });
 document.getElementById('app').innerHTML=`<div class="toolbar"><input id="search" placeholder="🔎 Aussteller oder Stand suchen" value="${esc(search)}"><select id="cat">${cats.map(c=>`<option ${c===filter?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="tabs"><button class="tab ${filter==='Alle'?'on':''}" onclick="setFilter('Alle')">Alle</button><button class="tab ${filter==='Technologie'?'on':''}" onclick="setFilter('Technologie')">⚙️ Technik</button><button class="tab ${filter==='Unternehmen & Ausbildung'?'on':''}" onclick="setFilter('Unternehmen & Ausbildung')">🧰 Lehre</button><button class="tab ${filter==='Bildung & Beruf'?'on':''}" onclick="setFilter('Bildung & Beruf')">🎓 Schule</button></div>
 <div class="grid">${list.map(card).join('')}</div>${!list.length?'<div class="empty">Hier ist noch nichts gespeichert.</div>':''}`;
 document.getElementById('search').oninput=e=>{search=e.target.value;render()}; document.getElementById('cat').onchange=e=>{filter=e.target.value;render()};
}
function setFilter(x){filter=x;render()}
function card(e){let done=state.answers[e.name], fav=state.favorites[e.name]; return `<div class="card"><div class="top"><div class="stand">${e.stand}</div><div><div class="name">${esc(e.name)}</div><div class="cat">${e.category}</div><div class="tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="status">${fav?'⭐':done?'✅':'⬜'}</div></div><button class="open" onclick='openEx(${JSON.stringify(e.name)})'>${done?'Bewertung ändern':'Stand bewerten'}</button></div>`}
function openEx(name){let e=EXHIBITORS.find(x=>x.name===name), a=state.answers[name]||[]; document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeM()">×</button><div class="stand" style="display:inline-block">${e.stand}</div><h2>${esc(e.name)}</h2><div class="cat">${e.category}</div><div class="tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><button class="fav" onclick='toggleFav(${JSON.stringify(name)})'>${state.favorites[name]?'⭐ Favorit – wieder entfernen':'☆ Als Favorit merken'}</button>${getQuestions(e).map((q,qi)=>`<div class="q"><b>${qi+1}. ${q[0]}</b><div class="answers">${q[1].map((x,ai)=>`<button class="ans ${a[qi]===ai?'sel':''}" onclick='pick(${JSON.stringify(name)},${qi},${ai})'>${x}</button>`).join('')}</div></div>`).join('')}<button class="save" onclick='finish(${JSON.stringify(name)})'>✓ Fertig & nächster Stand</button>`; document.getElementById('modal').classList.add('on')}
function pick(n,q,a){if(!state.answers[n])state.answers[n]=[];state.answers[n][q]=a;save();openEx(n)}
function toggleFav(n){state.favorites[n]=!state.favorites[n];save();openEx(n)}
function finish(n){let a=state.answers[n]||[]; if(a.filter(x=>x!==undefined).length<3){alert('Bitte beantworte mindestens 3 kurze Fragen 😊');return} save();closeM();render()}
function closeM(){document.getElementById('modal').classList.remove('on');render()}

function rating(e){
 let a=state.answers[e.name]; if(!a)return -1; let t=0,p=0;
 a.forEach((v,i)=>{if(v!==undefined){t+=vals[i][v];p+=4}});
 return p?t/p:-1;
}
function recommendations(){
 let sc=scores().slice(0,4).map(x=>x[0]);
 return EXHIBITORS.filter(e=>!state.answers[e.name] && e.tags.some(t=>sc.indexOf(t)>=0))
   .sort((a,b)=>b.tags.filter(t=>sc.indexOf(t)>=0).length-a.tags.filter(t=>sc.indexOf(t)>=0).length);
}
function renderRoute(){
 let rec=recommendations();
 let essentials=['AusBildung bis 18 (KOST Kärnten) und Jugendcoaching (NEBA)','BBRZ Reha GmbH - ein Unternehmen der Expertis Gruppe','BerufsInfoZentrum des Arbeitsmarktservice Kärnten','Wirtschaftskammer Kärnten (Bildungspolitik, Lehrlingsstelle, Testcenter Carinthia)','BSC Althofen','Infineon Technologies Austria AG','Kelag','ÖBB','Lakeside Science & Technology Park','Treffpunkt Technik'];
 let chosen=essentials.map(n=>EXHIBITORS.find(e=>e.name===n)).filter(Boolean);
 let extra=rec.filter(e=>chosen.indexOf(e)<0).slice(0,5);
 let route=[...chosen,...extra].filter(e=>!state.answers[e.name]);
 document.getElementById('app').innerHTML=`<div class="hallnote"><b>🗺️ Halle 1 – digitaler Wegweiser</b><br>Die offizielle BeSt-Seite verwendet einen interaktiven Hallenplan. In dieser App orientieren wir uns an den offiziellen Standnummern (z. B. U01, T05, B09). So könnt ihr den Stand am Hallenplan vor Ort schnell finden.</div>
 <div class="routebox mom"><strong>👩‍👦 Für Mama</strong><p style="margin-bottom:5px">Die Route beginnt mit Orientierung und mischt danach Technik, Ausbildung und andere Bereiche. Nach einigen Bewertungen werden zusätzliche Stände automatisch nach Maxis bisherigen Interessen vorgeschlagen.</p></div>
 <h3>🧭 Empfohlene nächste Stände</h3>${route.length?route.map((e,i)=>`<div class="routebox ${i<3?'nextpick':''}" onclick='openEx(${JSON.stringify(e.name)})'><span class="route-num">${i+1}</span><strong>${e.stand} · ${esc(e.name)}</strong><div class="tags" style="margin-left:38px">${e.tags.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`).join(''):'<div class="empty">Super – die wichtigsten vorgeschlagenen Stände sind bereits bewertet. ⭐</div>'}
 <div class="routebox"><strong>💬 Gute Frage für dich</strong><p>Bei einem interessanten Stand: „Was macht man bei euch an einem normalen Arbeitstag wirklich?“ und „Kann man später einmal schnuppern?“</p></div>`;
}

function scores(){
 let s={}, max={}; for(const e of EXHIBITORS){let a=state.answers[e.name];if(!a)continue; let total=0, possible=0;a.forEach((v,i)=>{if(v!==undefined){total+=vals[i][v];possible+=4}});if(!possible)continue; let r=total/possible; e.tags.forEach(t=>{s[t]=(s[t]||0)+r;max[t]=(max[t]||0)+1})}
 return Object.keys(s).map(k=>[k,Math.round(s[k]/max[k]*100)]).sort((a,b)=>b[1]-a[1])
}
function renderResult(){let sc=scores(), done=Object.keys(state.answers).length; if(done<3){document.getElementById('app').innerHTML=`<div class="hero"><h2>📊 Maxis Interessenprofil</h2><p>Bewertet zuerst mindestens 3 Stände. Je mehr unterschiedliche Stände Maxi anklickt, desto aussagekräftiger wird das Profil.</p></div>`;return}
 let top=sc.slice(0,8); let liked=EXHIBITORS.map(e=>{let a=state.answers[e.name];if(!a)return null;let t=0,p=0;a.forEach((v,i)=>{if(v!==undefined){t+=vals[i][v];p+=4}});return [e,p?t/p:0]}).filter(Boolean).sort((a,b)=>b[1]-a[1]).slice(0,6);
 document.getElementById('app').innerHTML=`<div class="hero"><h2>🎯 Maxis Interessenprofil</h2><p>Aus ${done} bewerteten Ständen. Das ist eine Orientierung – kein Berufstest und keine Festlegung.</p></div><div class="bars">${top.map(([k,v],i)=>`<div class="barrow"><div class="barlabel"><span>${i<3?['🥇','🥈','🥉'][i]:''} ${k}</span><span>${v}%</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div><div class="recommend"><h3>⭐ Diese Stände kamen bei Maxi am besten an</h3>${liked.map(([e,r])=>`<p><b>${e.stand} · ${esc(e.name)}</b><br><span class="cat">${e.tags.join(' · ')}</span></p>`).join('')}</div><div class="recommend"><h3>💡 So nutzt ihr das Ergebnis</h3><p>Schaut euch besonders die ersten 3 Interessensbereiche an. Unter „Route“ schlägt die App automatisch noch nicht besuchte Stände vor, die dazu passen. Besucht passende Favoriten noch einmal und fragt dort nach Schnuppermöglichkeiten, typischen Tätigkeiten und Ausbildungswegen.</p></div><div class="note">Die Kategorien werden aus dem Themengebiet des Ausstellers abgeleitet. Die Auswertung soll Interessen sichtbar machen, nicht Fähigkeiten oder Eignung diagnostizieren.</div><button class="fav" style="margin-top:18px" onclick="resetAll()">🗑️ Alle Bewertungen zurücksetzen</button>`}
function resetAll(){if(confirm('Wirklich alle Bewertungen und Favoriten löschen?')){state={answers:{},favorites:{}};save();render()}}
Array.prototype.forEach.call(document.querySelectorAll('.nav'),function(b){b.onclick=function(){page=b.getAttribute('data-page');filter='Alle';search='';render();};});document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')closeM();};
try { updateHeader(); render(); } catch(err) {
 document.getElementById('app').innerHTML='<div class="hero"><h2>App konnte in dieser Dateivorschau nicht vollständig starten</h2><p>Bitte die Datei in Safari öffnen oder die Online-Version verwenden.</p><p style="font-size:12px">'+String(err)+'</p></div>';
}
</script></body></html>
